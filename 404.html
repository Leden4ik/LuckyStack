<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена · LuckyStack</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<script>try { var t = localStorage.getItem('ls-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root {
  --bg: #0a0f1e; --panel: #111832; --line: #24305a; --fg: #e8ecf8; --muted: #9aa5c7; --accent: #ffb347; --accent-ink: #1a1206; --cool: #7fd3ff;
  --glow: none; color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #faf8f4; --panel: #ffffff; --line: #e4dfd4; --fg: #1d1b24; --muted: #5d5a66; --accent: #c2410c; --accent-ink: #ffffff; --cool: #0b6aa2;
    --glow: radial-gradient(900px 520px at 88% -140px, rgba(251, 146, 60, .22), transparent 70%); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #faf8f4; --panel: #ffffff; --line: #e4dfd4; --fg: #1d1b24; --muted: #5d5a66; --accent: #c2410c; --accent-ink: #ffffff; --cool: #0b6aa2;
  --glow: radial-gradient(900px 520px at 88% -140px, rgba(251, 146, 60, .22), transparent 70%); color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0a0f1e; --panel: #111832; --line: #24305a; --fg: #e8ecf8; --muted: #9aa5c7; --accent: #ffb347; --accent-ink: #1a1206; --cool: #7fd3ff;
  --glow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background: var(--glow) top / 100% 900px no-repeat, var(--bg); color: var(--fg);
  font: 400 16.5px/1.6 "Golos Text", "Segoe UI", system-ui, sans-serif;
}
main { max-width: 520px; text-align: center; }
.code { font: 400 .9rem/1 "JetBrains Mono", ui-monospace, Consolas, monospace; color: var(--muted); letter-spacing: .04em; }
h1 { font: 800 clamp(2rem, 7vw, 2.8rem)/1.1 Manrope, "Segoe UI", system-ui, sans-serif; letter-spacing: -.03em; margin: 18px 0 0; }
p { color: var(--muted); margin: 14px 0 0; }
.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }
a.btn { display: inline-flex; align-items: center; font: 600 .95rem/1 "Golos Text", system-ui, sans-serif; text-decoration: none; border-radius: 10px; padding: 12px 18px; border: 1px solid var(--line); color: var(--fg); background: var(--panel); }
a.btn.main { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
main > p a { color: var(--cool); text-underline-offset: 3px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <svg width="64" height="64" viewBox="0 0 34 34" aria-hidden="true">
    <circle cx="17" cy="17" r="15" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    <ellipse cx="17" cy="17" rx="15" ry="6" fill="none" stroke="var(--cool)" stroke-width="1.3" transform="rotate(-24 17 17)"/>
    <circle cx="17" cy="17" r="5" fill="var(--accent)"/>
  </svg>
  <div class="code">404</div>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка. Вся документация теперь на одной странице.</p>
  <div class="actions">
    <a class="btn main" href="/">На главную</a>
    <a class="btn" href="/docs.html">Документация</a>
  </div>
  <p lang="en">Page not found. <a href="/en/">English version</a></p>
</main>
</body>
</html>
